<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#f8fafc"/>

  <!-- Title Banner -->
  <rect x="24" y="20" width="1152" height="74" rx="10" fill="#0f172a"/>
  <text x="48" y="52" fill="#ffffff" font-size="22" font-weight="700">Results: simulation and QNX 8.0.6</text>
  <text x="48" y="77" fill="#cbd5e1" font-size="13.5">Preregistered 50 cm clearance (198,000 runs/arm; 3 arms = 594,000) + QNX 8.0.6 on QEMU aarch64le</text>

  <!-- Panel 1: Simulation -->
  <rect x="24" y="112" width="564" height="270" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="142" fill="#0f172a" font-size="16" font-weight="700">1. Simulation, 50 cm, 198,000 runs/arm (2 arms compared)</text>
  <text x="44" y="164" fill="#475569" font-size="12.5">Take-over requests: 32.05% -&gt; 0.061% (-31.99 pp, 95% CI 29.55-34.40)</text>

  <text x="44" y="202" fill="#334155" font-size="12.5" font-weight="600">All scenes (50 cm)</text>
  <rect x="175" y="189" width="209" height="16" rx="3" fill="#94a3b8"/>
  <text x="392" y="202" fill="#334155" font-size="12" font-weight="700">32.05%</text>
  <rect x="175" y="209" width="3" height="14" rx="2" fill="#16a34a"/>
  <text x="186" y="220" fill="#15803d" font-size="12" font-weight="700">0.061% (-31.99 pp)</text>

  <text x="44" y="248" fill="#334155" font-size="12.5" font-weight="600">M1 (380 cm)</text>
  <rect x="175" y="235" width="331" height="16" rx="3" fill="#94a3b8"/>
  <text x="514" y="248" fill="#334155" font-size="12" font-weight="700">50.67%</text>
  <rect x="175" y="255" width="2" height="14" rx="1" fill="#16a34a"/>
  <text x="185" y="266" fill="#15803d" font-size="12" font-weight="700">0.000%</text>

  <text x="44" y="294" fill="#334155" font-size="12.5" font-weight="600">M2 (305 cm)</text>
  <rect x="175" y="281" width="250" height="16" rx="3" fill="#94a3b8"/>
  <text x="433" y="294" fill="#334155" font-size="12" font-weight="700">38.22%</text>
  <rect x="175" y="301" width="2" height="14" rx="1" fill="#16a34a"/>
  <text x="185" y="312" fill="#15803d" font-size="12" font-weight="700">0.005%</text>

  <text x="44" y="340" fill="#334155" font-size="12.5" font-weight="600">M3 (17.1% slope)</text>
  <rect x="175" y="327" width="94" height="16" rx="3" fill="#94a3b8"/>
  <text x="277" y="340" fill="#334155" font-size="12" font-weight="700">14.39%</text>
  <rect x="175" y="347" width="4" height="14" rx="1" fill="#16a34a"/>
  <text x="187" y="358" fill="#15803d" font-size="12" font-weight="700">0.161%</text>

  <text x="44" y="375" fill="#64748b" font-size="11">baseline = never yields (45 s); always/random yield = 0.00%; human-driver uncalibrated</text>

  <!-- Panel 2: QNX 8.0.6 control matrix -->
  <rect x="612" y="112" width="564" height="270" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="632" y="142" fill="#134e4a" font-size="16" font-weight="700">2. QNX 8.0.6, control matrix</text>
  <text x="632" y="164" fill="#475569" font-size="12.5">135 trials per boot, 2 no-policy + 2 policy-enforced boots</text>

  <text x="632" y="202" fill="#334155" font-size="12.5" font-weight="600">Decision-to-actuation p99 under load (p99 only)</text>
  <rect x="632" y="212" width="320" height="18" rx="3" fill="#fca5a5"/>
  <text x="960" y="226" fill="#991b1b" font-size="12" font-weight="700">29,986-35,974 us (off)</text>
  <rect x="632" y="236" width="115" height="18" rx="3" fill="#0d9488"/>
  <text x="755" y="250" fill="#115e59" font-size="12" font-weight="700">11,882-12,010 us (FIFO 66/65)</text>

  <text x="632" y="290" fill="#334155" font-size="13" font-weight="600">Actuation-loop max: <tspan fill="#0f766e" font-weight="700">44-48 ms</tspan> (limit 50 ms)</text>
  <text x="632" y="320" fill="#334155" font-size="13" font-weight="600">Gate death seen: <tspan fill="#0f766e" font-weight="700">5-10 ms</tspan> (4 boots; 12 ms EV3H)</text>
  <text x="632" y="350" fill="#64748b" font-size="11.5">Measured on QEMU aarch64le with SCHED_FIFO 66/65 priority roles</text>

  <!-- Panel 3: QNX 8.0.6 security policy -->
  <rect x="24" y="402" width="564" height="236" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="44" y="432" fill="#991b1b" font-size="16" font-weight="700">3. QNX 8.0.6, security policy</text>
  <text x="44" y="456" fill="#475569" font-size="12.5">Unauthorised opens of /dev/v2v_ttl refused under policy-enforced boot</text>

  <rect x="44" y="476" width="524" height="58" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="62" y="502" fill="#991b1b" font-size="13.5" font-weight="700">EPERM 6/6 root (policy effect) + 4,218/4,218 post-drop</text>
  <text x="62" y="522" fill="#7f1d1d" font-size="11.5">0 allowed; post-drop also refused by file permissions (EACCES: G23 3,844/3,844)</text>

  <rect x="44" y="548" width="524" height="58" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="62" y="574" fill="#166534" font-size="14" font-weight="700">Fault-window gap: 0.35x normal (limit 2x)</text>
  <text x="62" y="594" fill="#14532d" font-size="12">Largest gap during injected faults stayed well below the 2x bound</text>

  <!-- Panel 4: QNX 8.0.6 mode switch -->
  <rect x="612" y="402" width="564" height="236" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="632" y="432" fill="#1e3a8a" font-size="16" font-weight="700">4. QNX 8.0.6, mode switch</text>
  <text x="632" y="456" fill="#475569" font-size="12.5">Admission-gate switchover across 1 no-policy + 1 policy-enforced boot</text>

  <text x="632" y="492" fill="#334155" font-size="13" font-weight="600">p99 12 ms, 420 episodes per boot (budget 120 ms)</text>
  <rect x="632" y="506" width="480" height="22" rx="4" fill="#e2e8f0"/>
  <rect x="632" y="506" width="48" height="22" rx="4" fill="#2563eb"/>
  <text x="690" y="522" fill="#1e3a8a" font-size="12.5" font-weight="700">p99 = 12 ms vs 120 ms budget (10x headroom)</text>

  <rect x="632" y="548" width="524" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="650" y="574" fill="#1e3a8a" font-size="14" font-weight="700">420 episodes per boot · 0 unpermitted moves</text>
  <text x="650" y="594" fill="#1e40af" font-size="11.5">HANDSHAKE -&gt; MAP (max 14 ms) &amp; MAP -&gt; RETREAT (max 20 ms), budget 120 ms</text>

  <!-- Footnote -->
  <text x="24" y="672" fill="#475569" font-size="12">QEMU TCG relative timings. In a separate 4-boot secpol set (EV3H, AS1, AS2, EV3I), EV3I missed the 50 ms limit at 97 ms (1/135) while host load peaked at 4.58.</text>
</svg>